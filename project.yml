name: WorkoutPlanner
options:
  bundleIdPrefix: live.workoutplanner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "757NQ675N5"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WorkoutPlanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        includes:
          - "*.swift"
        excludes:
          - Package.swift
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.workoutplanner.app
        PRODUCT_NAME: WorkoutPlanner
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WorkoutPlanner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "757NQ675N5"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: WorkoutPlanner
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
schemes:
  WorkoutPlanner:
    build:
      targets:
        WorkoutPlanner: all
    archive:
      config: Release
