name: WorkoutPlanner
options:
  bundleIdPrefix: live.workoutplanner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "757NQ675N5"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WorkoutPlanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        includes:
          - "*.swift"
        excludes:
          - Package.swift
          - project.yml
          - codemagic.yaml
          - README.md
          - Info.plist
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.workoutplanner.app
        PRODUCT_NAME: WorkoutPlanner
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "757NQ675N5"
    info:
      path: Info.plist
schemes:
  WorkoutPlanner:
    build:
      targets:
        WorkoutPlanner: all
    archive:
      config: Release
