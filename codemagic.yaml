definitions:
  ios_env: &ios_env
    xcode: latest
    groups:
      - workoutplanner_ios
    ios_signing:
      distribution_type: app_store
      bundle_identifier: live.workoutplanner.app
    vars:
      BUNDLE_ID: "live.workoutplanner.app"
      XCODE_PROJECT: "WorkoutPlanner.xcodeproj"
      XCODE_SCHEME: "WorkoutPlanner"
      TEAM_ID: "757NQ675N5"

workflows:
  ios-release:
    name: WorkoutPlanner iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *ios_env
    integrations:
      app_store_connect: somnus_asc_key
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Generar Xcode project (app .app real)
        script: |
          set -euo pipefail
          # El Package.swift de Playgrounds archiva un binario CLI, no un .app.
          # XcodeGen crea un target application firmable para TestFlight.
          brew install xcodegen
          xcodegen generate
          test -d "$XCODE_PROJECT"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Calcular número de build
        script: |
          set -euo pipefail
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          else
            LATEST="0"
          fi
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          echo "NEXT_BUILD_NUMBER=$NEXT" >> "$CM_ENV"
          agvtool new-version -all "$NEXT" || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" Info.plist

      - name: Firmar con provisioning profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Compilar IPA
        script: |
          set -euo pipefail
          dump_xcode_log() {
            local log
            log="$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -n 1 || true)"
            if [ -n "$log" ]; then
              echo "==== xcodebuild errors ===="
              grep -E "error:|fatal error|Provisioning|CodeSign|FAILED|exportArchive" "$log" | tail -n 80 || true
              echo "==== last 80 lines ===="
              tail -n 80 "$log"
            fi
          }
          trap dump_xcode_log ERR
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
