definitions:
  ios_env: &ios_env
    xcode: latest
    groups:
      - workoutplanner_ios
    ios_signing:
      distribution_type: app_store
      bundle_identifier: live.workoutplanner.app
    vars:
      BUNDLE_ID: "live.workoutplanner.app"
      XCODE_PROJECT: "WorkoutPlanner.xcodeproj"
      XCODE_SCHEME: "WorkoutPlanner"
      TEAM_ID: "757NQ675N5"

workflows:
  ios-release:
    name: WorkoutPlanner iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *ios_env
    integrations:
      app_store_connect: somnus_asc_key
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Generar Xcode project (app .app real)
        script: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          test -d "$XCODE_PROJECT"
          test -d App/Assets.xcassets/AppIcon.appiconset
          xcodebuild -list -project "$XCODE_PROJECT"
          grep "Assets.xcassets" WorkoutPlanner.xcodeproj/project.pbxproj || echo "WARN: Assets.xcassets no referenciado"

      - name: Calcular número de build
        script: |
          set -euo pipefail
          APP_ID="${APP_STORE_APPLE_ID:-}"

          if [ -z "$APP_ID" ]; then
            APP_ID="$(app-store-connect apps list --json 2>/dev/null \
              | python3 -c "import json,sys; apps=json.load(sys.stdin); print(next((a['id'] for a in apps if a.get('attributes',{}).get('bundleId')=='${BUNDLE_ID}'), ''))" \
              || true)"
            if [ -n "$APP_ID" ]; then
              echo "APP_STORE_APPLE_ID resuelto automáticamente: $APP_ID"
              echo "APP_STORE_APPLE_ID=$APP_ID" >> "$CM_ENV"
            fi
          fi

          LATEST="0"
          if [ -n "$APP_ID" ]; then
            RAW="$(app-store-connect get-latest-testflight-build-number "$APP_ID" --all-versions 2>/dev/null | tail -n 1 || echo "0")"
            LATEST="${RAW##*.}"
          fi
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            LATEST="0"
          fi

          NEXT=$((LATEST + 1))
          if [ "$NEXT" -le 1 ]; then
            NEXT=2
          fi

          echo "Último build en TestFlight: $LATEST → nuevo: $NEXT"
          echo "NEXT_BUILD_NUMBER=$NEXT" >> "$CM_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" App/Info.plist
          agvtool new-version -all "$NEXT"

      - name: Firmar con provisioning profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Compilar IPA
        script: |
          set -euo pipefail
          dump_xcode_log() {
            local log
            log="$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -n 1 || true)"
            if [ -n "$log" ]; then
              echo "==== xcodebuild errors ===="
              grep -E "error:|fatal error|Provisioning|CodeSign|FAILED|exportArchive" "$log" | tail -n 80 || true
              echo "==== last 80 lines ===="
              tail -n 80 "$log"
            fi
          }
          trap dump_xcode_log ERR
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty

      - name: Inyectar iconos en el IPA
        script: |
          set -euo pipefail
          # #region agent log
          DEBUG_LOG="$CM_BUILD_DIR/debug-98030d.log"
          debug_log() {
            local hid="$1" msg="$2" data="$3"
            printf '{"sessionId":"98030d","hypothesisId":"%s","location":"codemagic:inject","message":"%s","data":%s,"timestamp":%s}\n' \
              "$hid" "$msg" "$data" "$(python3 -c 'import time; print(int(time.time()*1000))')" >> "$DEBUG_LOG"
          }
          codesign_status() {
            local app="$1"
            local label="$2"
            local verify_rc=0 authority="unknown"
            codesign --verify --deep --strict "$app" >/dev/null 2>&1 || verify_rc=$?
            authority="$(codesign -dv "$app" 2>&1 | awk -F= '/Authority=/ {print $2; exit}' | tr -d '"' || echo unknown)"
            debug_log "$3" "$label" "{\"verifyRc\":$verify_rc,\"authority\":\"$authority\"}"
            echo "DEBUG [$label] verifyRc=$verify_rc authority=$authority"
          }
          # #endregion agent log

          IPA="$(ls build/ios/ipa/*.ipa | head -1)"
          IPA_ABS="$(cd "$(dirname "$IPA")" && pwd)/$(basename "$IPA")"
          WORKDIR="$(mktemp -d)"
          unzip -q "$IPA_ABS" -d "$WORKDIR"
          APP="$(find "$WORKDIR/Payload" -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP"

          codesign_status "$APP" "before-actool" "A"
          codesign -d --entitlements :- "$APP" > /tmp/wp-entitlements.plist 2>/dev/null || true

          xcrun actool "$CM_BUILD_DIR/App/Assets.xcassets" \
            --compile "$APP" \
            --platform iphoneos \
            --minimum-deployment-target 17.0 \
            --app-icon AppIcon \
            --output-partial-info-plist /tmp/icon-partial.plist

          # actool/build a veces dejan el Info.plist del .app sin claves iPad obligatorias
          /usr/libexec/PlistBuddy -c "Merge $CM_BUILD_DIR/App/Info.plist" "$APP/Info.plist"

          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconName" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NEXT_BUILD_NUMBER:-2}" "$APP/Info.plist"

          # Garantizar launch screen + orientaciones (App Store 90474/90475)
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:2 string UIInterfaceOrientationLandscapeRight" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:2 string UIInterfaceOrientationLandscapeLeft" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:3 string UIInterfaceOrientationLandscapeRight" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :MinimumOSVersion" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 17.0" "$APP/Info.plist"

          test -f "$APP/Assets.car"
          codesign_status "$APP" "after-actool-before-resign" "B"

          SIGN_IDENTITY="$(xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release 2>/dev/null \
            | awk -F' = ' '/^    CODE_SIGN_IDENTITY =/ {print $2; exit}')"
          if [ -z "$SIGN_IDENTITY" ] || [ "$SIGN_IDENTITY" = "-" ]; then
            SIGN_IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' '/Apple Distribution/ {print $2; exit}')"
          fi
          test -n "$SIGN_IDENTITY"
          debug_log "C" "sign-identity" "{\"identity\":\"$SIGN_IDENTITY\"}"
          echo "Re-firmando con: $SIGN_IDENTITY"

          if [ -s /tmp/wp-entitlements.plist ]; then
            codesign --force --sign "$SIGN_IDENTITY" --entitlements /tmp/wp-entitlements.plist --timestamp=none --generate-entitlement-der "$APP"
          else
            codesign --force --sign "$SIGN_IDENTITY" --timestamp=none --generate-entitlement-der "$APP"
          fi
          codesign_status "$APP" "after-resign" "A"

          /usr/libexec/PlistBuddy -c 'Print CFBundleIconName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist"

          rm -f "$IPA_ABS"
          (cd "$WORKDIR" && zip -qr "$IPA_ABS" Payload)
          codesign_status "$APP" "after-repack" "E"

      - name: Verificar iconos en el IPA
        script: |
          set -euo pipefail
          IPA="$(ls build/ios/ipa/*.ipa | head -1)"
          TMP="$(mktemp -d)"
          unzip -q "$IPA" -d "$TMP"
          APP="$(find "$TMP/Payload" -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP"
          echo "App bundle: $APP"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIconName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print UILaunchScreen' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print UISupportedInterfaceOrientations' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print UISupportedInterfaceOrientations~ipad' "$APP/Info.plist"
          test -f "$APP/Assets.car"
          codesign --verify --deep --strict "$APP"
          echo "Iconos, plist iPad y firma OK — listo para App Store Connect"
    artifacts:
      - build/ios/ipa/*.ipa
      - debug-98030d.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
