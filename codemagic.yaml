definitions:
  ios_env: &ios_env
    xcode: latest
    groups:
      # Opcional: APP_STORE_APPLE_ID (id numérico de la app en App Store Connect).
      # Si aún no existe la app, el workflow usa build number 1.
      - workoutplanner_ios
    ios_signing:
      distribution_type: app_store
      bundle_identifier: live.workoutplanner.app
    vars:
      BUNDLE_ID: "live.workoutplanner.app"
      XCODE_SCHEME: "WorkoutPlanner"
      TEAM_ID: "757NQ675N5"

workflows:
  ios-release:
    name: WorkoutPlanner iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *ios_env
    integrations:
      # Misma App Store Connect API key que Somnus (Codemagic → Integrations).
      app_store_connect: somnus_asc_key
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Listar esquemas
        script: |
          set -euo pipefail
          xcodebuild -list
          xcodebuild -scheme "$XCODE_SCHEME" -showBuildSettings \
            -destination generic/platform=iOS 2>/dev/null \
            | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|PRODUCT_NAME' || true

      - name: Calcular número de build
        script: |
          set -euo pipefail
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          else
            LATEST="0"
          fi
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          echo "NEXT_BUILD_NUMBER=$NEXT" >> "$CM_ENV"
          # Actualiza CFBundleVersion en el Package.swift de Playgrounds.
          sed -i '' "s/bundleVersion: \"[^\"]*\"/bundleVersion: \"$NEXT\"/" Package.swift

      - name: Descargar provisioning profiles
        script: |
          set -euo pipefail
          # Swift Playgrounds (.swiftpm): firma vía profiles del bundle id.
          xcode-project use-profiles

      - name: Compilar IPA
        script: |
          set -euo pipefail
          dump_xcode_log() {
            local log
            log="$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -n 1 || true)"
            if [ -n "$log" ]; then
              echo "==== xcodebuild errors ===="
              grep -E "error:|fatal error:|Provisioning profile|entitlement|CodeSign|does not support|FAILED" "$log" | tail -n 80 || true
              echo "==== last 80 lines of $log ===="
              tail -n 80 "$log"
            fi
          }
          trap dump_xcode_log ERR
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

          # Archive del producto iOSApplication definido en Package.swift
          ARCHIVE_PATH="$CM_BUILD_DIR/build/WorkoutPlanner.xcarchive"
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            archive

          # Export IPA firmado (profiles ya descargados por use-profiles)
          EXPORT_OPTS="$CM_BUILD_DIR/build/ExportOptions.plist"
          cat > "$EXPORT_OPTS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$IPA_DIR"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_DIR" \
            -exportOptionsPlist "$EXPORT_OPTS"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
